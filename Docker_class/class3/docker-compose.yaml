services:

  #Maestro vai orquestrar, diz para onde vai cada requisição
  maestro:
    image: nginx:latest
    ports:
      - 9090:8000
    #Faz com que o maestro puxe as conf locais ao invés do container
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  #Cria um serviço novo chamado patrick
  worker-patrick:
    #Usa imagem com http fixo
    image: hashicorp/http-echo
    #Mensagem que o container vai retornar
    command: "-text='Aulinha de IOT, tigradinha!'"
  worker-trevisan:
    image: hashicorp/http-echo
    command: "-text='Bora de Csharpzada? Só 50 minutinhos de intervalo antes...'"
  worker-don:
    image: hashicorp/http-echo
    command: "-text='ᵒᵒᶦ ᵐᵉⁿᶦⁿᵃˢ ᵇᵒʳᵃ ᵉˢᵗᵘᵈᵃʳ ᵇᵃⁿᶜᵒ'"

  #Serviço do cliente
  client-joy:
    #Build na imagem construída localmente
    build:
      context: .
      dockerfile: Dockerfile
    #Porta do host:porta do container
    ports:
      - "8081:8080"

  client-lays:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
  
  #Serviço chamado plankton
  plankton:
    #Usa a imagem mais recente dele
    image: crcardd/plankton:latest
    #O container conseguiria controlar o docker da maquina host
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    ports:
    - 5555:5032